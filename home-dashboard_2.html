<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #12141A;
    --bg-panel: #1B1E26;
    --line: #2A2E38;
    --amber: #E3A857;
    --amber-dim: #8A6B3B;
    --text: #F1EDE6;
    --text-dim: #8B909C;
    --text-faint: #565B67;
    --done: #4E7A63;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100%;
    overflow: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    padding: 2.4vw 2.6vw 1.6vw;
    gap: 1.6vw;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1.4vw;
  }

  .brand{ display:flex; align-items:baseline; gap: 0.9vw; }
  .brand .mark{ font-family:'Fraunces', serif; font-weight:600; font-size: 2.1vw; color: var(--amber); letter-spacing: -0.01em; }
  .brand .sub{ font-size: 1vw; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.14em; }
  .status{ font-size: 0.8vw; color: var(--text-faint); margin-left: 0.6vw; }
  .status.live{ color: var(--done); }
  .status.err{ color: #C97C7C; }

  .clock{ text-align:right; }
  .clock .time{ font-family:'Fraunces', serif; font-weight:300; font-size: 2.6vw; line-height:1; font-variant-numeric: tabular-nums; }
  .clock .date{ font-size: 1vw; color: var(--text-dim); margin-top: 0.3vw; letter-spacing: 0.04em; }

  .board{ flex:1; display:grid; grid-template-columns: repeat(4, 1fr); gap: 1.4vw; min-height:0; }

  .column{ background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }

  .column-head{ display:flex; align-items:center; gap:0.6vw; padding: 1.3vw 1.3vw 1vw; border-bottom: 1px solid var(--line); }

  .dot{ width: 0.7vw; height: 0.7vw; min-width:10px; min-height:10px; border-radius:50%; background: var(--amber); flex-shrink:0; }
  .column:nth-child(2) .dot{ background:#7CA6D9; }
  .column:nth-child(3) .dot{ background:#C97C7C; }
  .column:nth-child(4) .dot{ background:#8FBF8A; }

  .column-title{ font-family:'Fraunces', serif; font-weight:600; font-size: 1.35vw; letter-spacing: -0.01em; }
  .count{ margin-left:auto; font-size: 0.85vw; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .items{ flex:1; overflow-y:auto; padding: 0.6vw 0.9vw; display:flex; flex-direction:column; gap: 0.35vw; }
  .items::-webkit-scrollbar{ width:6px; }
  .items::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  .item{ display:flex; align-items:flex-start; gap: 0.7vw; padding: 0.65vw 0.5vw; border-radius: 8px; cursor:pointer; transition: background 0.15s ease; }
  .item:hover{ background: rgba(255,255,255,0.03); }
  .item:hover .remove{ opacity:1; }

  .check{ width: 1.1vw; height: 1.1vw; min-width:16px; min-height:16px; border-radius:5px; border: 1.5px solid var(--text-faint); flex-shrink:0; margin-top: 0.15vw; display:flex; align-items:center; justify-content:center; transition: all 0.15s ease; }
  .item.done .check{ background: var(--done); border-color: var(--done); }
  .check svg{ width:65%; opacity:0; transition: opacity 0.1s ease; }
  .item.done .check svg{ opacity:1; }

  .item-text{ font-size: 1.05vw; line-height:1.35; color: var(--text); word-break: break-word; }
  .item.done .item-text{ color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--text-faint); }

  .remove{ opacity:0; color: var(--text-faint); font-size: 1vw; padding: 0 0.3vw; transition: opacity 0.15s ease; }
  .remove:hover{ color: #C97C7C; }

  .avatar{ margin-left:auto; flex-shrink:0; cursor:pointer; }
  .avatar.solo{
    width: 1.4vw; height: 1.4vw; min-width:20px; min-height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; font-weight:700; font-size: 0.7vw;
    color: #12141A;
  }
  .avatar.solo.clay{ background: #8FAADB; }
  .avatar.solo.angie{ background: #E3919F; }
  .avatar.empty{
    width: 1.4vw; height: 1.4vw; min-width:20px; min-height:20px;
    border-radius:50%;
    border: 1.5px dashed var(--line);
  }
  .avatar.both{ display:flex; }
  .avatar.both .avatar-mini{
    width: 1.4vw; height: 1.4vw; min-width:20px; min-height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; font-weight:700; font-size: 0.7vw;
    color: #12141A;
    border: 2px solid var(--bg-panel);
  }
  .avatar.both .avatar-mini.clay{ background:#8FAADB; margin-right:-0.5vw; }
  .avatar.both .avatar-mini.angie{ background:#E3919F; }

  .empty-hint{ color: var(--text-faint); font-size: 0.95vw; padding: 0.8vw 0.5vw; font-style: italic; }

  .add-row{ display:flex; gap:0.5vw; padding: 0.9vw 1vw 1vw; border-top: 1px solid var(--line); }
  .add-row input{ flex:1; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-family:'Inter',sans-serif; font-size: 0.95vw; padding: 0.65vw 0.8vw; outline:none; }
  .add-row input:focus{ border-color: var(--amber-dim); }
  .add-row input::placeholder{ color: var(--text-faint); }
  .add-row button{ background: var(--amber); border:none; color: #1B1408; font-weight:600; font-size: 1.1vw; width: 2.6vw; min-width:34px; border-radius: 8px; cursor:pointer; transition: filter 0.15s ease; }
  .add-row button:hover{ filter:brightness(1.1); }

  .loading-veil{ position:fixed; inset:0; background: var(--bg); display:flex; align-items:center; justify-content:center; color: var(--text-faint); font-size: 1.2vw; z-index: 50; text-align:center; padding: 2vw; }
</style>
</head>
<body>

  <div class="loading-veil" id="veil">Connecting…</div>

  <header>
    <div class="brand">
      <span class="mark">Home</span>
      <span class="sub">Shared list</span>
      <span class="status" id="status">connecting</span>
    </div>
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">—</div>
    </div>
  </header>

  <div class="board" id="board"></div>

<!-- ============================================================ -->
<!-- FIREBASE SETUP: paste your config object below, then this   -->
<!-- file is ready to push to GitHub / Vercel.                    -->
<!-- ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // >>> REPLACE THIS with the config object from your Firebase console <<<
 const firebaseConfig = {
  apiKey: "AIzaSyCeHx7z8BuxXIXveM3ifCuZ1Wq5jINI0nk",
  authDomain: "bluecrest-home-base.firebaseapp.com",
  projectId: "bluecrest-home-base",
  storageBucket: "bluecrest-home-base.firebasestorage.app",
  messagingSenderId: "133594835819",
  appId: "1:133594835819:web:a49af5fd0a56d4cf3a7a2e",
  measurementId: "G-2F5PWH7172"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, "dashboard", "shared-list");

  const CATEGORIES = ["Household / Admin / Errands", "Witti", "Travel", "Wedding"];
  let state = {};
  CATEGORIES.forEach(c => state[c] = []);

  function uid(){ return Math.random().toString(36).slice(2,10); }

  function renderClock(){
    const now = new Date();
    document.getElementById('time').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    document.getElementById('date').textContent = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  }
  renderClock();
  setInterval(renderClock, 15000);

  function checkIcon(){
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#12141A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function avatarHtml(assignee){
    if(assignee === 'clay') return '<span class="avatar solo clay" title="Clay">C</span>';
    if(assignee === 'angie') return '<span class="avatar solo angie" title="Angie">A</span>';
    if(assignee === 'both') return '<span class="avatar both" title="Clay & Angie"><span class="avatar-mini clay">C</span><span class="avatar-mini angie">A</span></span>';
    return '<span class="avatar empty" title="Unassigned"></span>';
  }

  function cycleAssignee(cat, id){
    const item = state[cat].find(i => i.id === id);
    if(!item) return;
    const order = [undefined, 'clay', 'angie', 'both'];
    const idx = order.indexOf(item.assignee);
    item.assignee = order[(idx + 1) % order.length];
    render();
    persist();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    const board = document.getElementById('board');
    board.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const items = state[cat] || [];
      const open = items.filter(i => !i.done).length;

      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML = `
        <div class="column-head">
          <span class="dot"></span>
          <span class="column-title">${escapeHtml(cat)}</span>
          <span class="count">${open}</span>
        </div>
        <div class="items"></div>
        <div class="add-row">
          <input type="text" placeholder="Add to ${escapeHtml(cat)}…">
          <button aria-label="Add item">+</button>
        </div>
      `;
      board.appendChild(col);

      const itemsEl = col.querySelector('.items');
      if(items.length === 0){
        itemsEl.innerHTML = '<div class="empty-hint">Nothing here yet</div>';
      } else {
        const sorted = [...items].sort((a,b) => (a.done === b.done) ? 0 : (a.done ? 1 : -1));
        sorted.forEach(item => {
          const row = document.createElement('div');
          row.className = 'item' + (item.done ? ' done' : '');
          row.innerHTML = `
            <span class="check">${checkIcon()}</span>
            <span class="item-text">${escapeHtml(item.text)}</span>
            ${avatarHtml(item.assignee)}
            <span class="remove">✕</span>
          `;
          row.querySelector('.check').addEventListener('click', (e) => { e.stopPropagation(); toggleItem(cat, item.id); });
          row.addEventListener('click', () => toggleItem(cat, item.id));
          row.querySelector('.avatar').addEventListener('click', (e) => { e.stopPropagation(); cycleAssignee(cat, item.id); });
          row.querySelector('.remove').addEventListener('click', (e) => { e.stopPropagation(); removeItem(cat, item.id); });
          itemsEl.appendChild(row);
        });
      }

      const input = col.querySelector('input');
      const btn = col.querySelector('button');
      const submit = () => {
        const val = input.value.trim();
        if(!val) return;
        addItem(cat, val);
        input.value = '';
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
    });
  }

  async function persist(){
    try{
      await setDoc(docRef, state);
    }catch(err){
      console.error('Save failed', err);
      setStatus('err', 'sync error');
    }
  }

  function addItem(cat, text){ state[cat].push({ id: uid(), text, done: false }); render(); persist(); }
  function toggleItem(cat, id){ const item = state[cat].find(i => i.id === id); if(item){ item.done = !item.done; render(); persist(); } }
  function removeItem(cat, id){ state[cat] = state[cat].filter(i => i.id !== id); render(); persist(); }

  function setStatus(cls, text){
    const el = document.getElementById('status');
    el.className = 'status ' + cls;
    el.textContent = text;
  }

  // Realtime listener: fires on load AND whenever any device updates the doc
  onSnapshot(docRef, (snap) => {
    if(snap.exists()){
      const data = snap.data();
      CATEGORIES.forEach(c => { state[c] = data[c] || []; });
    }
    document.getElementById('veil').style.display = 'none';
    setStatus('live', 'synced');
    render();
  }, (err) => {
    console.error(err);
    document.getElementById('veil').textContent = 'Could not connect — check your Firebase config and rules.';
    setStatus('err', 'offline');
  });
</script>
</body>
</html>
